<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Kiosko</title>
  <meta name="description" content="Mis periódicos favoritos en un solo sitio.">
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kiosko">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --papel: #f6f2ea;
      --tinta: #16130f;
      --tinta-suave: #6f675c;
      --raya: #d9d1c3;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;
      --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --papel: #0f1115;
        --tinta: #f1ede6;
        --tinta-suave: #9a9488;
        --raya: #2a2d33;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--papel);
      color: var(--tinta);
      font-family: var(--sans);
      padding: max(20px, env(safe-area-inset-top)) 16px max(40px, env(safe-area-inset-bottom));
    }
    main { max-width: 820px; margin: 0 auto; }

    /* ---------- Cabecera tipo periódico ---------- */
    .cabecera { text-align: center; padding-bottom: 6px; }
    .cabecera .linea-sup {
      display: flex; justify-content: space-between; gap: 12px;
      font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
      color: var(--tinta-suave);
      border-bottom: 1px solid var(--raya); padding-bottom: 10px;
    }
    .cabecera h1 {
      font-family: var(--serif); font-weight: 900;
      font-size: clamp(48px, 15vw, 96px); line-height: 1;
      letter-spacing: -.02em; margin: 18px 0 14px;
    }
    .cabecera .doble-raya { border-top: 3px solid var(--tinta); border-bottom: 1px solid var(--tinta); height: 6px; }
    #saludo {
      font-family: var(--serif); font-style: italic; font-weight: 700;
      font-size: 18px; color: var(--tinta-suave); margin: 14px 0 0;
    }

    /* ---------- Secciones ---------- */
    section { margin-top: 34px; }
    h2 {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase;
      margin: 0 0 14px;
    }
    h2::after { content: ""; flex: 1; height: 1px; background: var(--raya); }

    .rejilla { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
    .rejilla.tres { grid-template-columns: repeat(3, 1fr); }
    .rejilla.una { grid-template-columns: 1fr; }
    @media (min-width: 640px) {
      .rejilla:not(.una):not(.tres) { grid-template-columns: repeat(4, 1fr); }
      .rejilla.tres .periodico { aspect-ratio: 16 / 9; }
    }

    /* ---------- Tarjetas de periódico ---------- */
    .periodico {
      position: relative; overflow: hidden;
      display: flex; flex-direction: column; justify-content: space-between;
      aspect-ratio: 1 / 1; padding: 14px;
      border-radius: 18px; text-decoration: none;
      color: var(--texto-tarjeta, #fff);
      background:
        radial-gradient(120% 90% at 0% 0%, rgba(255,255,255,.18), transparent 55%),
        var(--color);
      box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px -10px var(--color);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .rejilla.una .periodico { aspect-ratio: auto; min-height: 120px; }
    .periodico:hover { transform: translateY(-3px); box-shadow: 0 2px 4px rgba(0,0,0,.12), 0 14px 30px -10px var(--color); }
    .periodico:active { transform: scale(.97); }
    .periodico:focus-visible { outline: 3px solid var(--tinta); outline-offset: 3px; }

    .periodico .arriba { display: flex; justify-content: space-between; align-items: flex-start; }
    .periodico .logo {
      width: 52px; height: 52px; border-radius: 14px; overflow: hidden;
      background: #fff; display: grid; place-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    .periodico .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .rejilla.tres .logo { width: 40px; height: 40px; border-radius: 11px; }
    .periodico .flecha {
      margin-left: auto;
      width: 28px; height: 28px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(255,255,255,.18); font-size: 14px;
      transition: transform .18s ease;
    }
    .periodico:hover .flecha { transform: rotate(45deg); }
    .periodico .nombre { line-height: 1.02; overflow-wrap: anywhere; }
    .periodico .web { font-size: 11px; font-weight: 600; opacity: .75; margin-top: 6px; letter-spacing: .02em; }

    /* Estilos de letra para parecerse a cada cabecera */
    .estilo-serif .nombre  { font-family: var(--serif); font-weight: 900; font-size: clamp(22px, 6.4vw, 30px); }
    .estilo-italic .nombre { font-family: var(--serif); font-style: italic; font-weight: 700; font-size: clamp(22px, 6.4vw, 30px); }
    .estilo-sans .nombre   { font-family: var(--sans); font-weight: 800; font-size: clamp(20px, 5.8vw, 28px); letter-spacing: -.02em; }
    .estilo-deporte .nombre {
      font-family: var(--sans); font-weight: 900; font-style: italic; text-transform: uppercase;
      font-size: clamp(20px, 6vw, 30px); letter-spacing: -.03em;
    }
    .rejilla.tres .periodico { padding: 12px; border-radius: 16px; }
    .rejilla.tres .nombre { overflow-wrap: normal; font-size: clamp(18px, 5.4vw, 30px); }
    @media (prefers-color-scheme: dark) {
      .periodico { box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 8px 24px -12px var(--color); }
    }
    .rejilla.tres .flecha { width: 24px; height: 24px; font-size: 12px; }

    footer { margin-top: 40px; text-align: center; font-size: 12px; color: var(--tinta-suave); }
  </style>
</head>
<body>
  <main>
    <header class="cabecera">
      <div class="linea-sup"><span id="dia"></span><span id="fecha-corta"></span></div>
      <h1>El Kiosko</h1>
      <div class="doble-raya"></div>
      <p id="saludo"></p>
    </header>

    <div id="secciones"></div>

    <footer>Toca una cabecera para leer · Hecho con ❤️ en GitHub</footer>
  </main>

  <script>
    // ✏️ Para añadir o quitar periódicos, edita esta lista.
    //    estilo: 'serif' | 'italic' | 'sans' | 'deporte'
    //    columnas: 1, 2 o 3 (cuántas tarjetas por fila en el móvil)
    const secciones = [
      {
        titulo: 'Actualidad', columnas: 2,
        periodicos: [
          { nombre: 'El País',     url: 'https://elpais.com',      color: '#111111', estilo: 'serif',  logo: 'logos/elpais.png' },
          { nombre: 'El Mundo',    url: 'https://www.elmundo.es',  color: '#1d4e89', estilo: 'italic', logo: 'logos/elmundo.png' },
          { nombre: 'elDiario.es', url: 'https://www.eldiario.es', color: '#0e7c86', estilo: 'sans',   logo: 'logos/eldiario.png' },
          { nombre: 'La Marea',    url: 'https://www.lamarea.com', color: '#2f7ea6', estilo: 'serif',  logo: 'logos/lamarea.jpg' },
        ],
      },
      {
        titulo: 'Cantabria', columnas: 1,
        periodicos: [
          { nombre: 'El Diario Montañés', url: 'https://www.eldiariomontanes.es', color: '#123a6b', estilo: 'serif', logo: 'logos/eldiariomontanes.png' },
        ],
      },
      {
        titulo: 'Deportes', columnas: 3,
        periodicos: [
          { nombre: 'Marca', url: 'https://www.marca.com', color: '#e3001b', estilo: 'deporte', logo: 'logos/marca.png' },
          { nombre: 'AS',    url: 'https://as.com',        color: '#a50d23', estilo: 'deporte', logo: 'logos/as.png' },
          { nombre: 'Sport', url: 'https://www.sport.es',  color: '#1f2a5c', estilo: 'deporte', logo: 'logos/sport.png' },
        ],
      },
    ];

    // Fecha y saludo
    const ahora = new Date();
    const dia = ahora.toLocaleDateString('es-ES', { weekday: 'long' });
    document.getElementById('dia').textContent = dia;
    document.getElementById('fecha-corta').textContent =
      ahora.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
    const h = ahora.getHours();
    document.getElementById('saludo').textContent =
      (h < 6 ? 'Buenas noches' : h < 13 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches') +
      ', ¿qué leemos hoy?';

    // Pintar las secciones
    const columnas = { 1: 'una', 2: '', 3: 'tres' };
    const contenedor = document.getElementById('secciones');
    for (const s of secciones) {
      const section = document.createElement('section');
      const h2 = document.createElement('h2');
      h2.textContent = s.titulo;
      const rejilla = document.createElement('div');
      rejilla.className = ('rejilla ' + (columnas[s.columnas] || '')).trim();
      for (const p of s.periodicos) {
        const a = document.createElement('a');
        a.className = 'periodico estilo-' + (p.estilo || 'serif');
        a.href = p.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.style.setProperty('--color', p.color);
        a.setAttribute('aria-label', 'Abrir ' + p.nombre);
        a.innerHTML = '<div class="arriba"><span class="logo"><img alt="" loading="lazy"></span><span class="flecha" aria-hidden="true">↗</span></div><div><div class="nombre"></div><div class="web"></div></div>';
        if (p.logo) a.querySelector('.logo img').src = p.logo;
        else a.querySelector('.logo').remove();
        a.querySelector('.nombre').textContent = p.nombre;
        a.querySelector('.web').textContent = new URL(p.url).hostname.replace(/^www\./, '');
        rejilla.append(a);
      }
      section.append(h2, rejilla);
      contenedor.append(section);
    }

    // Permite instalar la web como app
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
